<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register | News Portal</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .register-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 50px;
            width: 400px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            color: #fff;
            animation: fadeIn 1.2s ease-in-out;
        }

        h2 {
            margin-bottom: 25px;
            font-size: 28px;
            color: #f0f0f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 500;
            text-align: left;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        select {
            background-color: #fff;
            color: #333;
        }

        input:focus,
        select:focus {
            box-shadow: 0 0 8px #5f9df7;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #43e97b, #38f9d7);
        }

        .error {
            color: #ff7b7b;
            margin-top: 10px;
            font-size: 14px;
        }

        p {
            margin-top: 20px;
            color: #d6d6d6;
        }

        a {
            color: #00f2fe;
            text-decoration: none;
            font-weight: 500;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="register-box">
    <h2>Create Account</h2>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <label>Full Name:</label>
        <input type="text" th:field="*{name}" placeholder="Enter your full name" required>

        <label>Username:</label>
        <input type="text" th:field="*{username}" placeholder="Enter your username" required>

        <label>Email:</label>
        <input type="email" th:field="*{email}" placeholder="Enter your email" required>

        <label>Password:</label>
        <input type="password" th:field="*{password}" placeholder="Enter a password" required>

        <label>Role:</label>
        <select th:field="*{roles}" required>
            <option value="">-- Select Role --</option>
            <option value="ROLE_USER">User</option>
            <option value="ROLE_REPORTER">Reporter</option>
            <option value="ROLE_ADMIN">Admin</option>
        </select>

        <button type="submit">Register</button>
    </form>

    <div th:if="${error}" th:text="${error}" class="error"></div>
    <p>Already have an account? <a th:href="@{/login}">Login here</a></p>
</div>
</body>
</html>
