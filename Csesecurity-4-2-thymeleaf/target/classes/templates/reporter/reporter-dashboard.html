<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporter Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #2ecc71;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        a, button {
            font-size: 14px;
            text-decoration: none;
            color: #007bff;
        }
        a:hover {
            text-decoration: underline;
        }
        button {
            border: none;
            background-color: transparent;
            color: #dc3545;
            cursor: pointer;
        }
        button:hover {
            text-decoration: underline;
        }
        nav a {
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <h1>Reporter Dashboard</h1>

    <nav>
        <a th:href="@{/reporter/upload}">Upload News</a> |
        <a th:href="@{/logout}">Logout</a>
    </nav>

    <h2>Your News</h2>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Content</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="news : ${newsList}">
                <td th:text="${news.title}"></td>
                <td th:text="${news.content}"></td>
                <td th:text="${news.status}"></td>
                <td>
                    <!-- ✅ FIXED edit-news URL -->
                    <a th:href="@{/reporter/edit-news/{id}(id=${news.id})}">Edit</a> |
                    <!-- ✅ FIXED delete-news URL -->
                    <form th:action="@{/reporter/delete-news/{id}(id=${news.id})}" 
                          method="post" style="display:inline">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this news?')">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
